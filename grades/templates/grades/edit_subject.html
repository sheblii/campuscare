{% extends 'users/base.html' %}

{% block title %}
  Edit Subject
{% endblock %}

{% block content %}
  <div class="container mt-5">
    <h1 class="text-center mb-4">Edit Subject</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="mt-3 text-end">
            <input type="hidden" name="subject_id" value="{{ subject.id }}" />
            <button type="submit" name="save_subject" class="btn btn-success">Save</button>
            <a href="{% url 'calculate' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
